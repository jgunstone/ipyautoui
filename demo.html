a=dict(json_schema_extra=dict(disabled=True))\n    )\n    float_slider: float = Field(default=2.2, ge=1, le=3)\n    float_text: float = 2.2\n    float_text_with_unit: float = Field(default=2.2, json_schema_extra=dict(unit=\"mm\"))\n    float_text_locked: float = Field(default=2.2, json_schema_extra=dict(disabled=True))\n    float_range_slider: tuple[confloat(ge=0, le=4), confloat(ge=0, le=4)] = Field(\n        default=(0, 2.2)\n    )\n    checkbox: bool = Field(\n        default=True, title=\"boolean checkbox\", description=\"a checkbox\"\n    )\n    dropdown: ty.Optional[FruitEnum] = None\n    dropdown_int: Number = Field(default=Number.ONE)  #\n    dropdown_int_optional: ty.Optional[Number] = Field(default=Number.ONE)  #\n    combobox: str = Field(\"apple\", examples=FruitEnum._member_names_)\n    combobox1: ty.Union[str, FruitEnum] = Field(\"apple\")  # TODO: make this work\n    dropdown_edge_case: FruitEnum = Field(\n        title=\"dropdwon FruitEnum with metadata\",\n        default=FruitEnum.apple,\n        description=\"updated description\",\n    )\n    dropdown_simple: str = Field(\n        default=\"asd\", json_schema_extra=dict(enum=[\"asd\", \"asdf\"])\n    )\n    text: str = Field(default=\"adsf\", description=\"a description about my string\")\n    text_short: Annotated[str, StringConstraints(min_length=0, max_length=20)] = (\n        \"short text\"\n    )\n    textarea: Annotated[str, StringConstraints(min_length=0, max_length=800)] = Field(\n        \"long text \" * 50, description=\"long text field\"\n    )\n    select_multiple: ty.List[FruitEnum] = Field(\n        (FruitEnum.apple,), description=\"a short select multiple list\"\n    )\n    select_multiple_nullable: ty.Optional[ty.List[FruitEnum]] = Field(\n        None, description=\"a short nullable select multiple list\"\n    )\n    tags_input: ty.List[LongEnum] = Field(\n        (LongEnum.a,), description=\"a long select multiple list\"\n    )\n    tags_input_nullable: ty.Optional[ty.List[LongEnum]] = Field(\n        (LongEnum.a,), description=\"a long nullable select multiple list\"\n    )\n\n    model_config = ConfigDict(json_schema_extra=dict(show_raw=True))\n\n```","text/plain":"<IPython.core.display.Markdown object>"},"metadata":{},"output_type":"display_data"}],"tabbable":null,"tooltip":null}},"fb0f417bfe204f7c97fc7bd545f1de0c":{"model_module":"@jupyter-widgets/base","model_module_version":"2.0.0","model_name":"LayoutModel","state":{"_model_module":"@jupyter-widgets/base","_model_module_version":"2.0.0","_model_name":"LayoutModel","_view_count":null,"_view_module":"@jupyter-widgets/base","_view_module_version":"2.0.0","_view_name":"LayoutView","align_content":null,"align_items":null,"align_self":null,"border_bottom":null,"border_left":null,"border_right":null,"border_top":null,"bottom":null,"display":null,"flex":null,"flex_flow":null,"grid_area":null,"grid_auto_columns":null,"grid_auto_flow":null,"grid_auto_rows":null,"grid_column":null,"grid_gap":null,"grid_row":null,"grid_template_areas":null,"grid_template_columns":null,"grid_template_rows":null,"height":null,"justify_content":null,"justify_items":null,"left":null,"margin":null,"max_height":null,"max_width":null,"min_height":null,"min_width":null,"object_fit":null,"object_position":null,"order":null,"overflow":null,"padding":null,"right":null,"top":null,"visibility":null,"width":null}},"fb137d66d1e3440bb872c4ced8266102":{"model_module":"@jupyter-widgets/base","model_module_version":"2.0.0","model_name":"LayoutModel","state":{"_model_module":"@jupyter-widgets/base","_model_module_version":"2.0.0","_model_name":"LayoutModel","_view_count":null,"_view_module":"@jupyter-widgets/base","_view_module_version":"2.0.0","_view_name":"LayoutView","align_content":null,"align_items":null,"align_self":null,"border_bottom":null,"border_left":null,"border_right":null,"border_top":null,"bottom":null,"display":null,"flex":null,"flex_flow":null,"grid_area":null,"grid_auto_columns":null,"grid_auto_flow":null,"grid_a       var localhostRegex = new RegExp(/^(?:http|https):\/\/localhost\:?[0-9]*\//);

              div.style.top = top - 2 + "px";

      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
